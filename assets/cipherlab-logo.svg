<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">CipherLab logo</title>
  <desc id="desc">A blue and white stylized C surrounding a padlock, with pixel fragments and circuit traces, above the word CipherLab.</desc>
  <defs>
    <linearGradient id="cGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf8ff"/>
      <stop offset=".28" stop-color="#42d8ff"/>
      <stop offset=".62" stop-color="#0878f9"/>
      <stop offset="1" stop-color="#102d8e"/>
    </linearGradient>
    <linearGradient id="lockGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f8ff"/>
      <stop offset=".42" stop-color="#41cfff"/>
      <stop offset="1" stop-color="#0757d8"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset=".67" stop-color="#eaf4ff"/>
      <stop offset=".68" stop-color="#48d7ff"/>
      <stop offset="1" stop-color="#1688ff"/>
    </linearGradient>
    <radialGradient id="backGlow">
      <stop offset="0" stop-color="#073a7a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="26" fill="#050914"/>
  <ellipse cx="600" cy="370" rx="430" ry="360" fill="url(#backGlow)"/>

  <!-- Binary texture -->
  <g fill="#1265bb" opacity=".32" font-family="monospace" font-size="20">
    <text x="554" y="260">00101001</text><text x="555" y="294">01001101</text>
    <text x="552" y="328">11010010</text><text x="555" y="362">00110101</text>
    <text x="555" y="396">10100110</text><text x="555" y="430">01101001</text>
    <text x="555" y="464">11001010</text>
  </g>

  <!-- Outer C ring, deliberately open at the right -->
  <path d="M 770 205 A 226 226 0 1 0 770 535 L 718 486 A 158 158 0 1 1 718 254 Z"
        fill="url(#cGradient)" stroke="#168dff" stroke-width="3" filter="url(#glow)"/>
  <path d="M 751 220 A 204 204 0 1 0 751 520" fill="none" stroke="#f5fbff" stroke-width="8" opacity=".88"/>

  <!-- Pixel fragments -->
  <g fill="url(#cGradient)">
    <rect x="300" y="260" width="42" height="42"/><rect x="350" y="286" width="26" height="26"/>
    <rect x="310" y="318" width="34" height="34"/><rect x="365" y="344" width="24" height="24"/>
    <rect x="282" y="382" width="38" height="38"/><rect x="334" y="414" width="30" height="30"/>
    <rect x="305" y="462" width="42" height="42"/><rect x="360" y="496" width="25" height="25"/>
    <rect x="385" y="260" width="20" height="20"/><rect x="395" y="372" width="28" height="28"/>
    <rect x="375" y="438" width="20" height="20"/><rect x="330" y="528" width="18" height="18"/>
  </g>
  <g stroke="#138dff" stroke-width="3" fill="none" opacity=".9">
    <path d="M210 292 H294"/><path d="M190 310 H284"/><path d="M226 406 H278"/>
    <path d="M184 438 H298"/><path d="M236 510 H302"/>
  </g>

  <!-- Circuit traces -->
  <g fill="none" stroke="#48cfff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M770 326 H828 L858 296 H902"/><path d="M775 372 H842 L864 350 H922"/>
    <path d="M775 418 H830 L854 442 H916"/><path d="M766 466 H824 L850 490 H902"/>
  </g>
  <g fill="#071427" stroke="#54d8ff" stroke-width="6">
    <circle cx="910" cy="296" r="12"/><circle cx="930" cy="350" r="12"/>
    <circle cx="924" cy="442" r="12"/><circle cx="910" cy="490" r="12"/>
  </g>

  <!-- Padlock -->
  <g filter="url(#glow)">
    <path d="M548 352 V326 A52 52 0 0 1 652 326 V352" fill="none" stroke="#e9f8ff" stroke-width="15" stroke-linecap="round"/>
    <rect x="520" y="348" width="160" height="142" rx="23" fill="url(#lockGradient)" stroke="#f3fbff" stroke-width="7"/>
    <path d="M600 392 a22 22 0 1 0 0 44 a22 22 0 0 0 0-44 M590 427 L580 459 H620 L610 427 Z" fill="#061326"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="800" letter-spacing="3" fill="url(#wordGradient)">CIPHERLAB</text>
  <path d="M190 737 H330 M870 737 H1010" stroke="#38c9ff" stroke-width="3"/>
  <circle cx="600" cy="737" r="7" fill="#168dff"/>
  <text x="455" y="748" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="5" fill="#c4d4e8">CLASSICAL CIPHERS</text>
  <text x="752" y="748" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="5" fill="#c4d4e8">MODERN CODE</text>
</svg>
